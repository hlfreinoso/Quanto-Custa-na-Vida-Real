name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Testes e tipos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        id: vitest
        shell: bash
        run: npm test -- --no-color 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      - name: Guardar log dos testes
        if: ${{ !cancelled() && (steps.vitest.outcome == 'success' || steps.vitest.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-log
          path: ${{ runner.temp }}/vitest.log
          if-no-files-found: error

      - name: Verificar tipos
        run: npm run typecheck
