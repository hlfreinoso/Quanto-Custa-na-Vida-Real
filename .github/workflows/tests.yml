name: Unit III integration tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/academic/verify-evidence.mjs
      - run: npm test -- --coverage --coverage.reportsDirectory=.logs/ci/coverage --reporter=default --reporter=json --outputFile=.logs/ci/tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit3-test-evidence
          path: .logs/ci
          include-hidden-files: true
